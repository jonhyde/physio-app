<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Voice audition</title>
<meta name="robots" content="noindex, nofollow">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  :root{--bg:#101418;--panel:#1a2028;--line:#2b3441;--ink:#eef2f6;--muted:#93a1b1;--accent:#6ea8fe;--ok:#3ddc97}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:16px/1.5 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;
       padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));
       -webkit-text-size-adjust:100%}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:14px;margin:0 0 16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  label{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  select,input[type=range]{width:100%}
  select{padding:12px;border-radius:10px;background:#0a0e12;color:var(--ink);
         border:1px solid var(--line);font-size:15px;-webkit-appearance:none}
  .row{display:flex;gap:10px;align-items:center;margin-top:12px}
  .row span{font-size:13px;color:var(--muted);min-width:74px}
  .val{color:var(--ink);font-variant-numeric:tabular-nums}
  button{width:100%;padding:15px;border-radius:11px;border:0;background:var(--accent);
         color:#08101c;font-size:16px;font-weight:600;-webkit-appearance:none;margin-top:8px}
  button.sec{background:#2b3441;color:var(--ink)}
  .cue{background:#0a0e12;border:1px solid var(--line);border-radius:10px;padding:11px 13px;
       margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .cue p{margin:0;font-size:14px}
  .cue button{width:auto;padding:9px 15px;margin:0;font-size:14px;flex:none}
  .count{color:var(--ok);font-weight:600}
  .filter{display:flex;gap:8px;margin-bottom:10px}
  .filter button{flex:1;margin:0;padding:10px;font-size:14px;background:#2b3441;color:var(--ink)}
  .filter button.on{background:var(--accent);color:#08101c}
</style>
</head>
<body>

<h1>Voice audition</h1>
<p class="sub">Download more voices first: Settings &rsaquo; Accessibility &rsaquo; Spoken Content &rsaquo; Voices &rsaquo; English (UK). Choose <b>Enhanced</b> or <b>Premium</b>, not Compact. Then reload this page.</p>

<div class="card">
  <label>Your shortlist</label>
  <div id="short"></div>
  <button id="ab">Compare all three, back to back</button>
  <button id="refresh" class="sec">Voices missing? Refresh</button>
</div>

<div class="card">
  <label>Available voices <span class="count" id="n"></span></label>
  <div class="filter">
    <button id="fGB" class="on">UK only</button>
    <button id="fEN">All English</button>
    <button id="fAll">Everything</button>
  </div>
  <select id="voice"></select>

  <div class="row"><span>Rate</span><input type="range" id="rate" min="0.6" max="1.3" step="0.05" value="1"><span class="val" id="rateV">1.00</span></div>
  <div class="row"><span>Pitch</span><input type="range" id="pitch" min="0.6" max="1.4" step="0.05" value="1"><span class="val" id="pitchV">1.00</span></div>

  <button id="play">Speak the long one</button>
  <button id="stop" class="sec">Stop</button>
</div>

<div class="card">
  <label>Real cues from your programme</label>
  <div id="cues"></div>
</div>

<div class="card">
  <label>Chosen settings</label>
  <p style="font:13px/1.6 ui-monospace,Menlo,monospace;color:var(--muted);margin:0" id="out">—</p>
  <button class="sec" id="copy">Copy for Claude</button>
</div>

<script>
const $=id=>document.getElementById(id);
const CUES=[
  'Single leg squat, set one of three. Standing on the left leg. Twelve reps, quarter depth. Resist the band.',
  'Rest. Up next, set two of three, right leg.',
  'Swap sides.',
  'Out to the side. Eight reps.',
  'At an angle behind you.',
  'Straight back behind you.',
  'Bridge. Twelve reps. Slow up, slow down.',
  'Squat. Box depth only. Do not go deeper.',
  'Band change. Fabric loop above the knees.',
  'That is Rehab B finished.'
];
const SHORTLIST=['Jamie','Kate','Stephanie'];
const AB_LINE='Single leg mini squats. Set one of three. Standing on your right leg. Twelve small squats. Push out against the band the whole time.';
let all=[], filter='GB';

function load(){
  all=speechSynthesis.getVoices();
  if(!all.length) return;
  render();
  renderShort();
}

function findVoice(name){
  return all.find(v=>v.name===name)
      || all.find(v=>v.name.toLowerCase().startsWith(name.toLowerCase()));
}

function renderShort(){
  $('short').innerHTML = SHORTLIST.map(n=>{
    const v=findVoice(n);
    return v
      ? `<div class="cue"><p><b>${v.name}</b><br><span style="color:var(--muted);font-size:12px">${v.lang}${v.localService?'':' · network'}</span></p>
         <button data-v="${v.name}">Play</button></div>`
      : `<div class="cue"><p><b>${n}</b><br><span style="color:#ff6b6b;font-size:12px">not visible to Safari</span></p></div>`;
  }).join('');
}

$('short').addEventListener('click',e=>{
  const b=e.target.closest('button[data-v]');
  if(!b) return;
  const v=findVoice(b.dataset.v);
  if(v){ $('voice').value=v.name; update(); }
  speakAs(v, AB_LINE);
});

function speakAs(v,text){
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  if(v){u.voice=v;u.lang=v.lang;} else u.lang='en-GB';
  u.rate=parseFloat($('rate').value);
  u.pitch=parseFloat($('pitch').value);
  speechSynthesis.speak(u);
}

$('ab').onclick=async()=>{
  const found=SHORTLIST.map(findVoice).filter(Boolean);
  if(!found.length){alert('None of the three are visible to Safari.');return;}
  $('ab').disabled=true;
  for(const v of found){
    speakAs(v,`${v.name}. ${AB_LINE}`);
    await new Promise(r=>{
      const t=setInterval(()=>{ if(!speechSynthesis.speaking){clearInterval(t);setTimeout(r,700);} },200);
      setTimeout(()=>{clearInterval(t);r();},15000);
    });
  }
  $('ab').disabled=false;
};

$('refresh').onclick=()=>{
  speechSynthesis.cancel();
  all=speechSynthesis.getVoices();
  render(); renderShort();
  $('refresh').textContent=`Refreshed — ${all.length} voices`;
  setTimeout(()=>$('refresh').textContent='Voices missing? Refresh',1800);
};
function render(){
  let list=all;
  if(filter==='GB') list=all.filter(v=>(v.lang||'').toLowerCase().startsWith('en-gb'));
  else if(filter==='EN') list=all.filter(v=>(v.lang||'').toLowerCase().startsWith('en'));
  list.sort((a,b)=>(a.lang+a.name).localeCompare(b.lang+b.name));
  $('n').textContent=`${list.length} shown of ${all.length}`;
  $('voice').innerHTML=list.map(v=>
    `<option value="${v.name}">${v.name} — ${v.lang}${v.localService?'':' (network)'}</option>`).join('')
    || '<option>None found — download some UK voices</option>';
  update();
}
function pick(){ return all.find(v=>v.name===$('voice').value) || null; }
function speak(text){
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  const v=pick();
  if(v){u.voice=v;u.lang=v.lang;} else u.lang='en-GB';
  u.rate=parseFloat($('rate').value);
  u.pitch=parseFloat($('pitch').value);
  speechSynthesis.speak(u);
}
function update(){
  const v=pick();
  $('rateV').textContent=parseFloat($('rate').value).toFixed(2);
  $('pitchV').textContent=parseFloat($('pitch').value).toFixed(2);
  $('out').textContent = v
    ? `voice: ${v.name}\nlang:  ${v.lang}\nrate:  ${parseFloat($('rate').value).toFixed(2)}\npitch: ${parseFloat($('pitch').value).toFixed(2)}`
    : 'No voice selected';
}

$('cues').innerHTML=CUES.map((c,i)=>
  `<div class="cue"><p>${c}</p><button data-i="${i}">Play</button></div>`).join('');
$('cues').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(b) speak(CUES[+b.dataset.i]);
});

$('play').onclick=()=>speak(CUES[0]);
$('stop').onclick=()=>speechSynthesis.cancel();
$('voice').onchange=()=>{update();speak('Set one of three. Standing on the left leg.');};
$('rate').oninput=update; $('pitch').oninput=update;
$('rate').onchange=()=>speak('Twelve reps, quarter depth.');
$('pitch').onchange=()=>speak('Twelve reps, quarter depth.');
$('fGB').onclick=()=>{filter='GB';flag();render()};
$('fEN').onclick=()=>{filter='EN';flag();render()};
$('fAll').onclick=()=>{filter='ALL';flag();render()};
function flag(){for(const [id,f] of [['fGB','GB'],['fEN','EN'],['fAll','ALL']])
  $(id).className = filter===f ? 'on' : '';}
$('copy').onclick=async()=>{
  try{await navigator.clipboard.writeText($('out').textContent);
      $('copy').textContent='Copied';setTimeout(()=>$('copy').textContent='Copy for Claude',1500);}
  catch(e){$('copy').textContent='Select the text above manually';}
};

speechSynthesis.addEventListener('voiceschanged',load);
load(); setTimeout(load,700); setTimeout(load,2000);
</script>
</body>
</html>
